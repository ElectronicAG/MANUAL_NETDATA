# device: S6730H-D
# Parte 3: elimina el LSP estático y habilita LDP; ejecutar después de la parte 2.
system-view
undo static-lsp transit LSP-A-B
return

system-view
mpls ldp
 quit

interface GigabitEthernet0/0/1
 mpls ldp
 quit

interface GigabitEthernet0/0/2
 mpls ldp
 quit
return

system-view
mpls
lsp-trigger all
quit

