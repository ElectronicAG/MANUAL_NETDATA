# device: AR651-B
# Parte 1: base y OSPF.
system-view
sysname AR651-B

interface GigabitEthernet0/0/1
 undo portswitch
 ip address 10.0.34.2 255.255.255.252
 undo shutdown
 quit

interface LoopBack0
 ip address 4.4.4.4 255.255.255.255
 quit

ospf 1
 area 0.0.0.0
  network 4.4.4.4 0.0.0.0
  network 10.0.34.0 0.0.0.3
  quit
 quit

return

huawei123
