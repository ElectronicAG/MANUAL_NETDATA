[project]
name = "huawei-serial-config"
version = "0.1.0"
description = "Carga de comandos Huawei VRP por consola serial"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5,<4"]

[project.scripts]
huawei-serial = "code_python.serial_config:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
